<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My profile</title>
<style>
  body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f5f7fa;margin:0;}
  .card{background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center;width:300px;}
  img.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:14px;background:#eee;}
  .name{font-size:18px;font-weight:600;}
  .uid{font-size:12px;color:#999;margin-top:4px;word-break:break-all;}
  .btn{display:inline-block;margin-top:18px;background:#333;color:#fff;text-decoration:none;
       padding:10px 20px;border-radius:8px;font-size:14px;}
</style>
</head>
<body>
  <div class="card">
    {% if line_profile and line_profile.picture_url %}
      <img class="avatar" src="{{ line_profile.picture_url }}" alt="">
    {% else %}
      <img class="avatar" alt="">
    {% endif %}
    <div class="name">{{ line_profile.display_name|default:request.user.username }}</div>
    {% if line_profile %}<div class="uid">LINE ID: {{ line_profile.line_user_id }}</div>{% endif %}
    <a class="btn" href="{% url 'accounts:liff_logout' %}">Log out</a>
  </div>
</body>
</html>
